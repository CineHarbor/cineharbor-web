name: Materialize reviewed release candidate
on:
  push:
    branches: [release/1.0.0-web-media-client]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ github.repository == 'CineHarbor/cineharbor-web' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply exact checkpointed candidate on its preparation branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, lzma, hashlib, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = '9fd1fc0b94ca72578dec2f0afbf3cea97e70cccc'
          branch = 'release/1.0.0-web-media-client'
          helper = '.github/workflows/materialize-reviewed-candidate.yml'
          parts = [f'.github/reviewed-candidate/part-{i}.txt' for i in range(3)]
          assert os.environ['GITHUB_REPOSITORY'] == 'CineHarbor/cineharbor-web'
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          assert git('rev-parse', 'HEAD^') == base, 'AGNIR_CHECKPOINT_CONFLICT: unexpected parent'
          assert sorted(git('diff', '--name-only', 'HEAD^', 'HEAD').splitlines()) == sorted([helper] + parts)
          assert git('ls-remote', 'origin', 'refs/heads/main').split()[0] == base, 'AGNIR_CHECKPOINT_CONFLICT: main advanced'
          assert git('ls-remote', 'origin', 'refs/heads/' + branch).split()[0] == os.environ['GITHUB_SHA'], 'branch advanced'
          encoded = ''.join(pathlib.Path(p).read_text() for p in parts)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd6bb1c3747cfeadf99812fe18504c88cc689753e6b9d9a2e114d7fa69bc3ac59'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--index', str(path)], check=True)
          subprocess.run(['git', 'rm', helper, *parts], check=True)
          assert git('write-tree') == '2a2faec19adc1948196694649cefec78d9d4d8b3', 'candidate tree mismatch'
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix(release): apply reviewed signed-media client and retire transport'], check=True)
          subprocess.run(['gh', 'auth', 'setup-git'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True)
          assert git('ls-remote', 'origin', 'refs/heads/' + branch).split()[0] == git('rev-parse', 'HEAD')
          print('VERIFIED_CANDIDATE=' + git('rev-parse', 'HEAD'))
          print('VERIFIED_TREE=' + git('write-tree'))
